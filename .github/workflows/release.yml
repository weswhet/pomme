name: Release

# Promotes a qualified alpha to a stable release: it rebuilds the alpha's
# commit with the stable version, waits for approval in the pomme-release
# environment, publishes the GitHub release, and updates the Homebrew formula.
# Docs/Releasing.md describes the steps.
on:
  workflow_dispatch:
    inputs:
      alpha:
        description: Alpha release to promote, such as v0.1.0-alpha.7
        required: true
        type: string
      qualification:
        description: Type QUALIFIED to confirm that this alpha passed release qualification
        required: true
        default: UNQUALIFIED
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}

    steps:
      - name: Check the inputs
        env:
          QUALIFICATION: ${{ inputs.qualification }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run the Release workflow from main."
            exit 64
          fi
          if [[ "$QUALIFICATION" != QUALIFIED ]]; then
            echo "::error::Type QUALIFIED only after the alpha passes release qualification. See Docs/Qualification.md."
            exit 64
          fi

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          ALPHA: ${{ inputs.alpha }}
        shell: bash
        run: |
          set -euo pipefail
          plan="$(Scripts/plan-release.sh stable --alpha "$ALPHA" --branch HEAD)"
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" >> "$GITHUB_OUTPUT"

      - name: Check that the alpha is a published pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA: ${{ inputs.alpha }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease="$(gh release view "$ALPHA" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [[ "$prerelease" != true ]]; then
            echo "::error::$ALPHA isn't a published alpha pre-release."
            exit 64
          fi

      # The notes come from main, so that you can finish them after the alpha.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/notes"
          Scripts/release-notes.sh stable --version "$VERSION" --commit "$COMMIT" \
            --previous-tag "$PREVIOUS_TAG" > "$RUNNER_TEMP/notes/notes.md"
          cat "$RUNNER_TEMP/notes/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: plan
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release.yml
    # A called workflow sees only the secrets that its caller passes, even
    # the pomme-signing environment's own secrets.
    secrets: inherit
    with:
      commit: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    name: Publish the release
    needs: [plan, build]
    runs-on: ubuntu-latest
    # Waits for a required reviewer to approve the deployment.
    environment: pomme-release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}

    steps:
      - name: Check the Homebrew deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::error::The pomme-release environment has no HOMEBREW_TAP_DEPLOY_KEY. Run Scripts/configure-release-secrets.sh."
            exit 64
          fi

      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Download the release artifacts
        uses: actions/download-artifact@v8
        with:
          name: pomme-${{ needs.plan.outputs.version }}
          path: dist

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Verify the release artifacts
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(shasum -a 256 dist/SHA256SUMS | awk '{print $1}')"
          if [[ -z "$EXPECTED_DIGEST" || "$actual" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::The downloaded artifacts don't match the build."
            exit 70
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A rerun after a failed Homebrew update finds the release already
          # published. Continue only if it has these exact artifacts.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS \
              --output "$RUNNER_TEMP/published-SHA256SUMS"
            if ! cmp -s dist/SHA256SUMS "$RUNNER_TEMP/published-SHA256SUMS"; then
              echo "::error::$TAG is already published with different artifacts."
              exit 70
            fi
            echo "$TAG is already published with these artifacts."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "Pomme $VERSION" \
            --notes-file "$RUNNER_TEMP/notes/notes.md" \
            --latest
          echo "Published [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: weswhet/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update the Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(shasum -a 256 "dist/pomme-$VERSION-arm64.tar.gz" | awk '{print $1}')"
          mkdir -p homebrew-tap/Formula
          Scripts/render-homebrew-formula.sh --version "$VERSION" --sha256 "$sha256" \
            --output homebrew-tap/Formula/pomme.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pomme.rb
          if git diff --cached --quiet; then
            echo "The Homebrew formula is already at $VERSION."
            exit 0
          fi
          git commit -m "pomme $VERSION"
          git push
          echo "Updated the Homebrew formula to $VERSION." >> "$GITHUB_STEP_SUMMARY"
