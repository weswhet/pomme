# Lint the documentation against the Google developer documentation style guide.
# Run `npm run lint:style`; `vale sync` downloads the Google package into styles/.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Pomme
Packages = Google

[*.{md,mdx}]
BasedOnStyles = Vale, Google

# Crawler mode pages are deliberately informal: exclamation points, the
# System's first person, and jokes are the point. Check spelling only.
# See CRAWLER_VOICE.md.
[**/crawler/**/*.{md,mdx}]
BasedOnStyles = Vale
